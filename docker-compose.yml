version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./temp:/app/temp
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py

